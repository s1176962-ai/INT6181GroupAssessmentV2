[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv"]
extend-exclude = [".workbuddy-ai/backup"]

[tool.ruff.lint.per-file-ignores]
# Compatibility facade intentionally exposes the imported public token names.
"learning_platform/ui_tokens.py" = ["F401"]
# These local capture utilities set DPI and import paths before loading Tk UI.
".workbuddy-ai/capture_*.py" = ["E402"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
